
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>ПКО-300 — Рейтинг коллекторских агентств</title>
      <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
      <!-- Preload above-the-fold hero image so it starts loading before the JS bundle parses. -->
      <link rel="preload" as="image" href="/images/hero-architecture.webp" fetchpriority="high" />
      <!-- Preload the cyrillic Inter subset (the only one actually used on Russian pages). -->
      <link rel="preload" as="font" type="font/woff2" crossorigin
            href="/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa0ZL7W0Q5n-wU.woff2" />
      <!-- Preload first-paint data so the browser starts fetching in parallel with parsing JS. -->
      <link rel="preload" as="fetch" type="application/json" crossorigin href="/data/rating.json" />
      <link rel="preload" as="fetch" type="application/json" crossorigin href="/data/logo-map.json" />
      <link rel="preload" as="fetch" type="application/json" crossorigin href="/data/articles.json" />
    </head>

    <body style="margin:0;background:#0a0f15">
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
